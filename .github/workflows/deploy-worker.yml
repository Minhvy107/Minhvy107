# Tự động đưa máy chủ nạp (server/worker.js) lên Cloudflare mỗi khi code trong thư mục server/ thay đổi trên main.
# Cần secret trong GitHub: Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN  (tạo từ mẫu "Edit Cloudflare Workers")
#   (Account ID đã ghi sẵn bên dưới; nếu đặt secret CLOUDFLARE_ACCOUNT_ID thì secret được ưu tiên)
# Khóa SEPAY_API_KEY đã đặt trên Cloudflare được giữ nguyên, không cần đưa vào đây.
name: Cập nhật máy chủ Cloudflare

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra khóa Cloudflare
        id: chk
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2aafd661337f1c25f504edf3203914b3' }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then
            echo "::warning::Chưa có secret CLOUDFLARE_API_TOKEN nên bỏ qua bước cập nhật máy chủ."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tìm ID kho KV "ORDERS"
        if: steps.chk.outputs.ok == 'true'
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2aafd661337f1c25f504edf3203914b3' }}
        run: |
          ID=$(curl -fsS -H "Authorization: Bearer $T" \
            "https://api.cloudflare.com/client/v4/accounts/$A/storage/kv/namespaces?per_page=100" \
            | jq -r '.result[] | select(.title=="ORDERS" or (.title|endswith("-ORDERS"))) | .id' | head -n1)
          if [ -z "$ID" ]; then echo "::error::Không tìm thấy kho KV tên ORDERS trong tài khoản Cloudflare."; exit 1; fi
          sed -i "s/DIEN_ID_KV_VAO_DAY/$ID/" server/wrangler.toml
          echo "Dùng kho KV ORDERS: $ID"

      - name: Đưa máy chủ lên Cloudflare
        if: steps.chk.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2aafd661337f1c25f504edf3203914b3' }}
          workingDirectory: server
          command: deploy

      - name: Kiểm tra máy chủ sau khi cập nhật
        if: steps.chk.outputs.ok == 'true'
        run: |
          U=https://cholaxanh-nap.tnhn1311.workers.dev
          sleep 5
          echo "== /health"; curl -sS -i "$U/health" | tail -n 3
          echo "== POST /order (thử đơn sai, mong 400)"; curl -sS -i -X POST -H 'content-type: application/json' -H 'origin: https://minhvy107.github.io' -d '{"code":"x"}' "$U/order" | grep -iE "^HTTP|access-control|error"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$U/health")
          if [ "$code" != "200" ]; then echo "::error::Máy chủ trả $code"; exit 1; fi
