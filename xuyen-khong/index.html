/* ============ LƯỚI & TÌM ĐƯỜNG ============ */
function rebuild(){
  own.fill(0);for(const id of S.land){const [x,y,w,h]=LAND[id].r;for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)own[j*COLS+i]=1;}
  occ.fill(-1);byUid.clear();
  S.b.forEach((b,k)=>{const d=BT[b.t];byUid.set(b.uid,b);if(!b.q)b.q=[];for(let j=0;j<d.h;j++)for(let i=0;i<d.w;i++)occ[(b.y+j)*COLS+b.x+i]=k;});
  recalc();
}
function walk(x,y){if(x<0||x>=COLS||y<0||y>=ROWS)return false;if(y===ROAD)return true;if(!own[y*COLS+x])return false;const k=occ[y*COLS+x];return k<0||!!BT[S.b[k].t].walk;}
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function bfsAll(sx,sy){const D=new Int16Array(COLS*ROWS).fill(-1);const Q=[sx+sy*COLS];D[Q[0]]=0;for(let i=0;i<Q.length;i++){const p=Q[i],x=p%COLS,y=(p/COLS)|0;for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy;if(!walk(nx,ny))continue;const np=nx+ny*COLS;if(D[np]>=0)continue;D[np]=D[p]+1;Q.push(np);}}return D;}
function bfs(sx,sy,tx,ty){
  if(sx===tx&&sy===ty)return [];
  if(!walk(tx,ty))return null;
  const prev=new Int16Array(COLS*ROWS).fill(-2);const s=sx+sy*COLS,t=tx+ty*COLS;prev[s]=-1;const Q=[s];
  for(let i=0;i<Q.length;i++){const p=Q[i];if(p===t)break;const x=p%COLS,y=(p/COLS)|0;
    for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy;if(!walk(nx,ny))continue;const np=nx+ny*COLS;if(prev[np]!==-2)continue;prev[np]=p;Q.push(np);}}
  if(prev[t]===-2)return null;const out=[];for(let p=t;p!==s;p=prev[p])out.push([p%COLS,(p/COLS)|0]);return out.reverse();
}
const needAcc=d=>!!(d.st&&d.c==='quan')||!!d.fac;
function acc(b){const d=BT[b.t];return {x:b.x+((d.w-1)>>1),y:b.y+d.h};}
function rdist(a,b){const A=BT[a.t],B=BT[b.t];const dx=Math.max(0,a.x-(b.x+B.w-1),b.x-(a.x+A.w-1)),dy=Math.max(0,a.y-(b.y+B.h-1),b.y-(a.y+A.h-1));return Math.max(dx,dy);}
function canPlace(t,x,y){
  const d=BT[t];
  if(x<0||y<0||x+d.w>COLS||y+d.h>ROAD)return 'Ngoài khu đất';
  for(let j=y;j<y+d.h;j++)for(let i=x;i<x+d.w;i++){
    if(!own2(i,j))return 'Chưa mua mảnh đất này';
    if(occ[j*COLS+i]>=0)return 'Đã có công trình';
    if(j===GY&&(i===5||i===6))return 'Không được chắn cổng làng';
  }
  if(needAcc(d)&&y+d.h>=ROAD)return 'Cần chừa lối cho khách phía trước';
  const tmp={uid:-9,t,x,y,lv:1,q:[]};S.b.push(tmp);rebuildOcc();
  let why=null;const D=bfsAll(GX,GY);
  for(const b of S.b){if(!needAcc(BT[b.t]))continue;const a=acc(b);if(!walk(a.x,a.y)||D[a.x+a.y*COLS]<0){why=b===tmp?'Lối vào bị chắn':'Sẽ chắn lối vào '+BT[b.t].n;break;}}
  S.b.pop();rebuildOcc();return why;
}
function rebuildOcc(){occ.fill(-1);S.b.forEach((b,k)=>{const d=BT[b.t];for(let j=0;j<d.h;j++)for(let i=0;i<d.w;i++)occ[(b.y+j)*COLS+b.x+i]=k;});}

/* ============ CHỈ SỐ CÔNG TRÌNH ============ */
let comboNew=[];
function recalc(){
  for(const b of S.b){b._cb=0;b._cn=[];}
  for(const C of COMBO){
    for(const A of S.b){if(A.t!==C.t[0])continue;const mem=[A];let ok=true;
      for(const ti of C.t.slice(1)){let f=null;for(const B of S.b)if(B.t===ti&&rdist(A,B)<=3){f=B;break;}if(!f){ok=false;break;}mem.push(f);}
      if(!ok)continue;
      for(const m of mem)if(!m._cn.includes(C.n)){m._cb++;m._cn.push(C.n);}
      if(!S.cf[C.id]){S.cf[C.id]=1;comboNew.push(C);}
    }
  }
  for(const b of S.b){const d=BT[b.t];let ap=(d.ap||0)*(1+.3*(b.lv-1))+b._cb*4;
    for(const o of S.b){const od=BT[o.t];if(od.dec&&o!==b&&rdist(b,o)<=2)ap+=od.dec*(o.t==='den'&&S.m===8?2:1);}
    b._ap=ap;}
  while(comboNew.length){const C=comboNew.shift();S.pop+=10;S.sp+=2;banner('🎉 Combo mới: '+C.n+'! (⭐+10, ✦+2)');snd('combo');}
}
const staffAt=b=>S.staff.find(s=>s.at===b.uid);
function price(b){const d=BT[b.t],s=staffAt(b);let m=1+.3*(b.lv-1)+.2*b._cb+(S.sys.bantinh?.1:0)+(S.path==='thuong'?.05*S.trank:0);if(s)m+=s.noi/250;return Math.max(1,Math.round(d.p*m));}
function svTime(b){const d=BT[b.t],s=staffAt(b);return d.sv*(s?Math.max(.35,1.4-s.noi/80):1);}
function prodRate(b){const d=BT[b.t],s=staffAt(b);if(!s)return 0;const st=d.c==='nong'?s.suc:s.kheo;let r=(.6+st/50)*(1+.2*b._cb)*(1+.25*(b.lv-1));
  if(d.c==='nong'){r*=d.ss[sea()];if(S.sys.phan)r*=1.25;if(S.ev.han>0&&!S.sys.baohiem)r*=.5;}if(d.c==='xuong'&&S.sys.det)r*=1.3;return r/(d.cy*WEEK);}

const cv=$('#cv');let cx=cv.getContext('2d'),SC=3,TM=0;
function R(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(x,y,w,h);}

function person(x,y,o,fr,sit){
  x=Math.round(x);y=Math.round(y);
  R(x-3,y-1,7,2,'rgba(0,0,0,.2)');
  if(o.long){R(x-3,y-7,7,6,o.sh);R(x-2,y-1,2,1,'#222');R(x+1,y-1,2,1,'#222');}
  else{R(x-2,y-3,2,fr?3:2,o.pa);R(x+1,y-3,2,fr?2:3,o.pa);R(x-3,y-7,7,4,o.sh);}
  R(x-4,y-7,1,3,o.sk);R(x+4,y-7,1,3,o.sk);
  if(o.apron)R(x-2,y-6,5,3,'#e9dcc0');
  if(o.gold){R(x-3,y-7,7,1,'#f4c542');R(x,y-6,1,4,'#f4c542');}
  if(o.bag)R(x+3,y-6,2,3,'#a67c52');
  if(o.phone)R(x+4,y-6,1,2,'#222');
  R(x-3,y-12,7,5,o.sk);R(x-3,y-13,7,2,o.hr);R(x-3,y-11,1,2,o.hr);R(x+3,y-11,1,2,o.hr);
  R(x-2,y-10,1,1,'#222');R(x+1,y-10,1,1,'#222');

const tileOf=c=>[clamp(Math.floor(c.x/T),0,COLS-1),clamp(Math.floor(c.y/T),0,ROWS-1)];
function choose(c){
  const L=(CT[c.ty]||CT.phu).like;let tot=0;const arr=[];
  for(const b of S.b){const d=BT[b.t];if(!needAcc(d))continue;if(c.vis.includes(b.uid))continue;if(d.st&&!staffAt(b))continue;
    if(d.fac&&!c.vis.length)continue;const pr=d.p?price(b):0;if(pr>c.bud)continue;
    let w=(b._ap+4)*(L.includes(b.t)?3:1)*(b.q.length>=3?.15:1)*(d.fac?.5:1)*(b.oos>0?.2:1);arr.push([b,w]);tot+=w;}
  if(!arr.length)return null;let r=Math.random()*tot;for(const [b,w] of arr)if((r-=w)<=0)return b;return arr[arr.length-1][0];
}
function bub(c,ic){c.bub=ic;c.bubT=1.6;}
function nextT(c){
  c.wait=0;c.mode='go';c.tgt=null;
  if(c.n<=0)return leave(c);
  const t=choose(c);if(!t)return leave(c);
  const [x,y]=tileOf(c),a=acc(t),p=bfs(x,y,a.x,a.y);if(!p)return leave(c);
  c.path=p;c.tgt=t.uid;
}
function leave(c){
  if(!c.vis.length){c.sat-=1;bub(c,'😑');}
  c.mode='out';c.tgt=null;const [x,y]=tileOf(c);const ex=Math.random()<.5?0:COLS-1;c.path=bfs(x,y,ex,ROAD)||[];
}
function rmQ(b,c){const i=b.q.indexOf(c);if(i>=0)b.q.splice(i,1);if(b.cur===c)b.cur=null;}
function buy(c,b){
  const d=BT[b.t],s=staffAt(b);c.vis.push(b.uid);c.n--;
  const X=b.x*T+d.w*8,Y=b.y*T;
  if(d.use){for(const g in d.use)if((S.inv[g]||0)<d.use[g]){b.oos=3;c.sat-=.6;bub(c,'❌');return;}for(const g in d.use)S.inv[g]-=d.use[g];}
  const pr=d.p?price(b):0;
  if(pr>c.bud){bub(c,'💸');c.sat-=.4;return;}
  c.bud-=pr;S.money+=pr;S.ms.inc+=pr;S.ys.sales+=pr;S.k.earn+=pr;b.sales=(b.sales||0)+pr;b.cnt=(b.cnt||0)+1;S.k.sold[b.t]=(S.k.sold[b.t]||0)+1;
  let sat=d.fac?d.fs:.6+b._ap/20+(s?s.noi/50:0)+((CT[c.ty]||CT.phu).like.includes(b.t)?.6:0)-c.wait/8+(S.sys.vesinh?.4:0);
  c.sat+=sat;
  if(pr>0){fx.push({x:X,y:Y,s:'+'+fm(pr),c:'#ffe14a',t:1.1});snd('coin');}
  if(sat>2.2)bub(c,'♥');else if(sat<.3)bub(c,'💢');
  if(s){s.exp++;if(s.exp>=s.lv*15)lvUp(s);}
  if(!d.fac&&Math.random()<.005+b._cb*.004){S.sp++;fx.push({x:X,y:Y-8,s:'✦+1',c:'#9fe6ff',t:1.3});snd('idea');}
}
function finish(c){
  const dp=clamp(c.sat*.6,-1.5,3);S.pop=Math.max(0,S.pop+dp);S.ms.vis++;S.ms.sat+=c.sat;S.ys.vis++;S.ys.sat+=c.sat;
  if(c.ty==='rv'){if(c.sat>=4){S.pop+=60;S.sp+=3;banner('🖌️ Quan Tổng đốc khen làng hết lời! ⭐+60, ✦+3');}else{S.pop=Math.max(0,S.pop-20);banner('😒 Quan Tổng đốc không hài lòng… ⭐-20');}}
  if(S.path==='quan'&&S.qrank>=3)S.dt=clamp(S.dt+(c.sat>2?.02:c.sat<0?-.05:0),0,100);
}
function upd(c,dt){
  if(c.bubT>0)c.bubT-=dt;
  if(c.path.length){const [nx,ny]=c.path[0];const tx=nx*T+8,ty=ny*T+13,dx=tx-c.x,dy=ty-c.y,dist=Math.hypot(dx,dy),sp=32*dt;
    if(dist<=sp){c.x=tx;c.y=ty;c.path.shift();}else{c.x+=dx/dist*sp;c.y+=dy/dist*sp;}
    c.ft+=dt;if(c.ft>.16){c.ft=0;c.fr^=1;}return;}
  c.fr=0;
  if(c.mode==='out'){c.dead=1;return;}
  const b=byUid.get(c.tgt);if(!b){nextT(c);return;}
  if(BT[b.t].st&&!staffAt(b)){rmQ(b,c);nextT(c);return;}
  if(c.mode==='go'){b.q.push(c);c.mode='q';c.wait=0;}
  if(c.mode==='q'){if(b.q[0]===c&&!b.cur){b.cur=c;c.mode='sv';c.st=svTime(b);}else{c.wait+=dt;if(c.wait>14){rmQ(b,c);c.sat-=1.5;bub(c,'💢');c.vis.push(b.uid);nextT(c);}}return;}
  if(c.mode==='sv'){c.st-=dt;if(c.st<=0){rmQ(b,c);buy(c,b);nextT(c);}}
}
function updMe(dt){
  if(!me)return;if(me.path.length){upd(me,dt);return;}
  me.idle=(me.idle||0)-dt;if(me.idle>0)return;me.idle=rnd(1.5,4);
  const [x,y]=tileOf(me);const D=bfsAll(x,y);const opts=[];for(let i=0;i<COLS*ROWS;i++)if(D[i]>0&&D[i]<6&&((i/COLS)|0)<ROAD)opts.push(i);
  if(opts.length){const p=pick(opts);me.path=bfs(x,y,p%COLS,(p/COLS)|0)||[];}
  if(Math.random()<.25)bub(me,pick(['📱','✨','💭','🤔','😎']));
}
function repathAll(){for(const c of cust){if(c.mode==='out'){leave(c);continue;}if(c.mode==='go'){const b=byUid.get(c.tgt);if(!b){nextT(c);continue;}const [x,y]=tileOf(c),a=acc(b);const p=bfs(x,y,a.x,a.y);if(p)c.path=p;else nextT(c);}}if(me){me.path=[];}}
function release(b){for(const c of cust)if(c.tgt===b.uid){rmQ(b,c);c.mode='go';c.path=[];nextT(c);}b.q=[];b.cur=null;}

/* ============ SẢN XUẤT ============ */
function produce(b,dt){
  const d=BT[b.t];if(!d.out)return;const r=prodRate(b);if(!r)return;
  b.prog=(b.prog||0)+r*dt;if(b.prog<1){b.hold=0;return;}b.prog=1;
  if(d.in){for(const g in d.in)if((S.inv[g]||0)<d.in[g]){b.hold=2;return;}}
  let n=d.yd;if(d.c==='nong'&&S.sys.f1)n=Math.round(n*1.3);
  const room=cap()-(S.inv[d.out]||0);if(room<=0){b.hold=1;return;}
  if(d.in)for(const g in d.in)S.inv[g]-=d.in[g];
  n=Math.min(n,room);S.inv[d.out]=(S.inv[d.out]||0)+n;S.k.harv[d.out]=(S.k.harv[d.out]||0)+n;b.prog=0;b.hold=0;
  const s=staffAt(b);if(s){s.exp+=2;if(s.exp>=s.lv*15)lvUp(s);}
  fx.push({x:b.x*T+d.w*8,y:b.y*T,s:'+'+n+G[d.out].ic,c:'#c8ff9a',t:1.3,sz:6});
}
function lvUp(s){s.exp=0;s.lv++;s.suc+=ri(1,4);s.kheo+=ri(1,4);s.noi+=ri(1,4);s.sal+=3;banner('⬆️ '+s.n+' lên Lv '+s.lv+'!');snd('lv');}

/* ============ VÒNG LẶP ============ */
function step(dt){
  S.t+=dt;
  spawnAcc+=dt*spawnRate()/WEEK;while(spawnAcc>=1){spawnAcc--;if(cust.length<75)spawn();}
  if(S.burst>0){burstT-=dt;if(burstT<=0){burstT=1.2;S.burst--;spawn(S.burstTy||'lai');}}
  for(const b of S.b){if(b.oos>0)b.oos-=dt;if(BT[b.t].out)produce(b,dt);}
  for(const c of cust)upd(c,dt);
  for(let i=cust.length-1;i>=0;i--)if(cust[i].dead){finish(cust[i]);cust.splice(i,1);}
  updMe(dt);
  for(const f of fx){f.t-=dt;f.y-=dt*10;}fx=fx.filter(f=>f.t>0);
  if(S.t>=WEEK){S.t-=WEEK;endWeek();}
}
function endWeek(){
  S.w++;
  S.ads.forEach(a=>a.w--);S.ads=S.ads.filter(a=>a.w>0);
  for(const k in S.ev)if(S.ev[k]>0)S.ev[k]--;
  for(const sh of S.ships){sh.wk--;if(sh.wk<=0)shipBack(sh);}S.ships=S.ships.filter(s=>s.wk>0);
  if(S.w>4){S.w=1;endMonth();}
  weekly();checkQuests();save();
}
function endMonth(){
  let sal=0;for(const s of S.staff)sal+=s.sal;let up=0;for(const b of S.b)up+=BT[b.t].cost*(BT[b.t].c==='trang'?.005:.02);
  let bl=0;if(S.path==='quan'&&S.qrank>=3){bl=QT[S.qrank].bl+Math.round(S.pop*.3*S.dt/100);}
  const exp=Math.round(sal+up);S.money+=bl-exp;S.ms.exp+=exp;S.ms.inc+=bl;
  S.hist.push({inc:S.ms.inc,exp:S.ms.exp});if(S.hist.length>12)S.hist.shift();
  banner(`📅 Tổng kết tháng ${S.m}: thu ${fm(S.ms.inc)} · chi ${fm(S.ms.exp)}${bl?' (bổng lộc '+fm(bl)+')':''}`);
  S.ms={inc:0,exp:0,vis:0,sat:0};
  S.pop*=.98;
  if(S.money<0){S.debt++;if(S.debt>=3){gameOver();return;}msg('⚠️ Hệ thống: Ký chủ đang âm tiền! Âm 3 tháng liền sẽ bị xóa sổ.');}else S.debt=0;
  refreshCand();
  S.m++;if(S.m>12){S.m=1;yearEnd();S.y++;}
  checkRank();
  if(S.path==='thuong'){while(S.trank<TH.length-1&&assets()>=TH[S.trank+1].a){S.trank++;sysPop('Thăng hạng thương hội',`Ký chủ đã trở thành <b>${TH[S.trank].n}</b>!<br>Mọi quán +5% giá.`);}}
  if(S.path==='quan'&&S.qrank>=3&&S.qrank<QT.length-1){const nx=QT[S.qrank+1];if(S.dt>=nx.dt&&S.rank>=nx.rk){S.qrank++;sysPop('Thánh chỉ thăng quan',`Ký chủ được thăng <b>${nx.n}</b>!<br>Bổng lộc ${fm(nx.bl)} văn/tháng.`);}}
  if(S.m===1){S.sp+=3;banner('🧧 Tết đến! Hệ thống lì xì ✦+3 · Khách đông gấp rưỡi');}
  if(S.m===8)banner('🏮 Tháng Tám: Trung thu – Đèn lồng đẹp gấp đôi, khách đông hơn');
  if(S.m===2&&cnt('dinh')){S.ev.hoi=2;banner('🥁 Hội làng mùa Xuân! Khách đông gấp đôi 2 tuần');}
  if(!S.sq&&S.q>=3)genSide();
  recalc();
}
const RIV=['Làng Mõ Rơm','Làng Bến Đò','Làng Hoa Cau','Trấn Phù Sa'],RIVK=[.6,.9,1.25,1.7];
function yearEnd(){

function curQ(){if(S.q<QM.length)return QM[S.q];const L=S.path==='thuong'?QTH:QQ;const i=S.q-QM.length;return L[i]||null;}

function sqVal(sq){return sq.k==='sold'?sold(sq.key):sq.k==='harv'?harv(sq.key):S.k.earn;}

function shipBack(sh){
  const R0=ROUTES[sh.r];if(R0.risk&&Math.random()<R0.risk){const v=Math.round(sh.val*.4);S.money+=v;S.ms.inc+=v;banner(`⛈️ Thuyền từ ${R0.n} gặp bão! Chỉ cứu được ${fm(v)} văn.`);snd('bad');}
  else{S.money+=sh.val;S.ms.inc+=sh.val;S.k.earn+=sh.val;banner(`⛵ Thuyền từ ${R0.n} về bến! Lãi ${fm(sh.val)} văn`);snd('combo');}
  S.k.trips++;
}
function loadShip(ri_){
  const R0=ROUTES[ri_];const capS=40;let left=capS,val=0;const goods={};
  const gs=Object.keys(R0.mul).sort((a,b)=>G[b].ws*R0.mul[b]-G[a].ws*R0.mul[a]);
  for(const g of gs){const n=Math.min(left,S.inv[g]||0);if(!n)continue;goods[g]=n;left-=n;val+=n*G[g].ws*R0.mul[g]*1.6;}
  return {goods,val:Math.round(val),n:capS-left};
}
let exam=null;
function startExam(){
  const E=EXAM[S.qrank];if(S.money<E.fee){banner('Không đủ lộ phí '+E.fee+' văn');return;}
  S.money-=E.fee;const qs=[...QA].sort(()=>Math.random()-.5).slice(0,5);exam={E,qs,i:0,ok:0,hint:S.sys.luyenthi?2:0,cut:null};examQ();
}
function examQ(){
  const ex=exam,q=ex.qs[ex.i];
  showModal(`📝 ${ex.E.n} – Câu ${ex.i+1}/5`,()=>`<div class="muted">Cần đúng ${ex.E.need}/5 · Đang đúng: ${ex.ok}</div><div class="q">${q[0]}</div>`+
    q[1].map((o,j)=>ex.cut&&ex.cut.includes(j)?'':`<button class="btn opt b" data-a="${A(()=>answer(j))}">${'ABCD'[j]}. ${o}</button>`).join('')+
    (ex.hint&&!ex.cut?`<button class="btn sm" data-a="${A(()=>{ex.hint--;const w=[0,1,2,3].filter(k=>k!==q[2]).sort(()=>Math.random()-.5).slice(0,2);ex.cut=w;examQ();})}">📒 Sổ tay luyện thi (còn ${ex.hint})</button>`:''),1);
}
function answer(j){
  const ex=exam,q=ex.qs[ex.i];const ok=j===q[2];if(ok)ex.ok++;snd(ok?'coin':'bad');ex.i++;ex.cut=null;
  if(ex.i<5){banner(ok?'✅ Đúng!':'❌ Sai – đáp án: '+q[1][q[2]]);examQ();return;}
  const pass=ex.ok>=ex.E.need;S.exNext=S.y*12+S.m+3;exam=null;
  if(pass){S.qrank++;if(S.qrank===3&&ex.ok===5)S.trang=1;S.dt=clamp(S.dt+5,0,100);
    const ttl=S.qrank===3?(S.trang?'🎖️ TRẠNG NGUYÊN! Vinh quy bái tổ, được bổ làm Tri huyện':'Đỗ Tiến sĩ, được bổ làm Tri huyện'):'Đỗ '+ex.E.to+'!';
    S.pop+=40*S.qrank;sysPop('Bảng vàng',`${ttl}<br>Đúng ${ex.ok}/5 · ⭐+${40*S.qrank}`);snd('combo');}
  else sysPop('Trượt rồi…',`Đúng ${ex.ok}/5. Ba tháng nữa thi lại nhé!`);
  checkQuests();updTop();
}

let AC=null,lastCoin=0;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
const SFX={coin:[[988,.05],[1319,.08]],build:[[196,.06],[262,.09]],combo:[[523,.08],[659,.08],[784,.08],[1047,.18]],lv:[[659,.07],[784,.07],[988,.12]],click:[[700,.025]],bad:[[220,.12],[170,.16]],idea:[[1175,.05],[1568,.08]],sys:[[1568,.06],[2093,.12]]};
function snd(k){if(!S||!S.opt.sfx)return;if(k==='coin'){const n=performance.now();if(n-lastCoin<110)return;lastCoin=n;}const a=ac();if(!a)return;let t=a.currentTime;
  for(const [f,d] of SFX[k]){const o=a.createOscillator(),g=a.createGain();o.type=k==='sys'?'sine':'square';o.frequency.value=f;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);t+=d;}}
const MEL=[72,0,74,0,77,0,79,77,74,0,72,0,69,0,0,0,72,0,74,0,77,0,81,79,77,0,74,0,72,0,0,0],BAS=[48,0,0,0,53,0,0,0,45,0,0,0,50,0,0,0,48,0,0,0,53,0,0,0,43,0,0,0,48,0,0,0];
let bgmT=null,bstep=0;
function bgm(){clearInterval(bgmT);bgmT=null;if(!S||!S.opt.bgm)return;const a=ac();if(!a)return;bgmT=setInterval(()=>{if(document.hidden)return;const t=a.currentTime+.02;
  for(const [arr,ty,v] of [[MEL,'triangle',.035],[BAS,'square',.018]]){const n=arr[bstep%32];if(!n)continue;const o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=440*Math.pow(2,(n-69)/12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.32);}bstep++;},190);}

function save(){if(!S)return;try{const o=JSON.parse(JSON.stringify(S,(k,v)=>(k==='q'&&Array.isArray(v))||k==='cur'||k[0]==='_'?undefined:v));localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}

function resize(){
  const W=$('#mapWrap').clientWidth,H=$('#mapWrap').clientHeight,dpr=window.devicePixelRatio||1;
  SC=Math.max(1,Math.floor(Math.min(W*dpr/(COLS*T),H*dpr/(ROWS*T))*2)/2);
  cv.width=Math.round(COLS*T*SC);cv.height=Math.round(ROWS*T*SC);cv.style.width=cv.width/dpr+'px';cv.style.height=cv.height/dpr+'px';cx=cv.getContext('2d');
}
window.addEventListener('resize',resize);
function tileAt(e){const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*COLS*T,y=(e.clientY-r.top)/r.height*ROWS*T;return [Math.floor(x/T),Math.floor(y/T),x,y];}
cv.addEventListener('pointermove',e=>{if(!BM||e.pointerType!=='mouse')return;const [x,y]=tileAt(e);if(x!==BM.gx||y!==BM.gy){BM.gx=x;BM.gy=y;updBH();}});

  if(!S)return;ac();const [x,y,px,py]=tileAt(e);
  if(BM){if(BM.gx===x&&BM.gy===y&&e.pointerType!=='mouse'){place();return;}if(e.pointerType==='mouse'&&BM.gx===x&&BM.gy===y){place();return;}BM.gx=x;BM.gy=y;updBH();return;}
  for(const c of cust){if(Math.abs(c.x-px)<5&&py<c.y+2&&py>c.y-15){const d=CT[c.ty]||{n:'Quan Tổng đốc'};banner(`${d.n} · còn ${fm(c.bud)} văn · ${c.sat>2?'😊':c.sat<0?'😠':'🙂'}`);return;}}
  if(me&&Math.abs(me.x-px)<5&&py<me.y+2&&py>me.y-15){banner(`👤 ${S.name} (ký chủ xuyên không) · "${pick(['Ở đây không có wifi…','Nhớ trà sữa quá!','Hệ thống ơi, bao giờ được về?','Làm giàu thôi!'])}"`);return;}
  if(x<0||y<0||x>=COLS||y>=ROWS)return;const k=occ[y*COLS+x];
  if(k>=0){openB(S.b[k]);return;}
  if(y<ROAD&&!own2(x,y)){buildTab='dat';openBuild();}
});
let last=performance.now(),saveT=0,topT=0;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;TM=now/1000;
  if(S&&running){if(!modalOpen()||!cur||!cur.mid){const sp=[0,1,2,4][S.spd];let g=dt*sp;while(g>0){const s=Math.min(g,.05);step(s);g-=s;}}
    saveT+=dt;if(saveT>20){saveT=0;save();}topT+=dt;if(topT>.25){topT=0;updTop();}}
  if(S)draw();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
function startGame(st){
  S=st;$('#title').classList.add('hide');rebuild();resize();
  if(!S.cand||!S.cand.length)refreshCand();
  me={id:0,ty:'me',o:look('me'),x:GX*T+8,y:GY*T+13,path:[],mode:'me',bub:'',bubT:0,fr:0,ft:0,vis:[],sat:0};
  running=true;updTop();updQuestBar();bgm();
  if(!S.tut){S.tut=1;intro();}
}
function intro(){
  const pages=[
    `Năm 2026. Sau ca tăng ca thứ năm trong tuần, bạn gục xuống bàn phím…<br><br>Mở mắt ra: mái rạ, khói bếp, tiếng gà gáy. Một bà cụ nhìn bạn chằm chằm: <i>"Người ở đâu mà ăn mặc lạ thế này?"</i>`,
    `<span class="sysT">[Ting!] Hệ thống Làm Giàu Xuyên Không đã liên kết.</span><br><br>Ký chủ: <b>${S.name}</b><br>Thời đại: niên hiệu An Lạc năm thứ 1<br>Vốn khởi nghiệp: <b>800 văn</b><br>Nhiệm vụ cuối: làm giàu và đổi vận cả làng.`,
    `<b>Cách chơi</b><br>🌾 <b>Nông trại</b> làm ra hàng → 📦 Kho<br>🏮 <b>Quán</b> lấy hàng trong kho bán cho khách<br>👥 Mỗi công trình cần 1 người làm<br>🎉 Đặt công trình hợp nhau gần nhau để có <b>Combo</b><br>✦ Làm nhiệm vụ Hệ thống để đổi kiến thức hiện đại<br><br>Khi làng thành hình, bạn sẽ chọn: <b>Thương nhân</b> hay <b>Quan lại</b>?`,
  ];
  let i=0;const show=()=>showModal('✦ Hệ thống',()=>`<p style="font-size:15px">${pages[i]}</p><button class="btn opt b" data-a="${A(()=>{i++;if(i<pages.length)show();else{closeModal();sysToast('Nhiệm vụ đầu tiên: Trồng 1 Luống rau!');}})}">${i<pages.length-1?'Tiếp ▶':'Bắt đầu!'}</button>`,1,1);show();
}
/* màn hình tiêu đề */
(function title(){
  const c=$('#tc'),g=c.getContext('2d');let t0=0;
  function tick(now){if($('#title').classList.contains('hide'))return;c.width=160;c.height=Math.round(160*innerHeight/innerWidth);const H=c.height;
    const grd=g.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#0b1838');grd.addColorStop(.6,'#3a2a5a');grd.addColorStop(1,'#d27a4a');g.fillStyle=grd;g.fillRect(0,0,160,H);
    for(let i=0;i<40;i++){g.fillStyle='rgba(255,255,255,'+(.3+.3*Math.sin(now/600+i))+')';g.fillRect((i*37)%160,(i*53)%(H*.5),1,1);}
    g.fillStyle='#ffe9a8';g.beginPath();g.arc(120,H*.18,9,0,7);g.fill();
    g.fillStyle='#2a1a3a';for(let x=0;x<160;x+=1){const h=H*.72-Math.sin(x/14)*6-Math.sin(x/5)*2;g.fillRect(x,h,1,H);}
    g.fillStyle='#1a1028';for(let i=0;i<6;i++){const x=10+i*28,y=H*.7;g.fillRect(x,y,18,10);g.fillRect(x-2,y-4,22,4);g.fillStyle='#ffcf6a';g.fillRect(x+7,y+3,3,4);g.fillStyle='#1a1028';}
    for(let i=0;i<5;i++){const x=(i*41+now/60)%180-10,y=H*.4+Math.sin(now/700+i)*6-i*8;g.fillStyle='#ff7a3a';g.fillRect(x,y,3,4);g.fillStyle='rgba(255,180,80,.35)';g.fillRect(x-1,y-1,5,6);}
    requestAnimationFrame(tick);}
  requestAnimationFrame(tick);
  const sv=load();
  if(sv)$('#tcont').innerHTML=`<button class="btn b" id="tcont2">▶ Tiếp tục: Làng ${sv.name} · Năm ${sv.y} Th${sv.m}</button>`;
  if(sv)$('#tcont2').onclick=()=>{ac();startGame(sv);};
  $('#tnew').onclick=()=>{ac();if(sv&&!confirm('Bắt đầu kiếp mới sẽ xóa bản lưu cũ. Tiếp tục?'))return;
    const n=(prompt('Tên của ký chủ (cũng là tên làng):','Lá Xanh')||'Lá Xanh').trim().slice(0,16)||'Lá Xanh';
    const st=fresh(n);S=st;st.staff.push(mkStaff());st.staff.push(mkStaff());startGame(st);save();};
})();
requestAnimationFrame(frame);
</script>
