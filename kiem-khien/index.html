<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1733">
<title>Kiếm & Khiên – Nữ Kỵ Sĩ Idle</title>
<style>
:root{
  --bg:#141129; --panel:#221d40; --panel2:#2c2652; --line:#3d3570; --text:#f3eefe; --mute:#a79fcc;
  --gold:#ffcf4a; --gem:#6be3ff; --stone:#c9b3ff; --good:#5be08a; --bad:#ff5d73; --acc:#ff8fb8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:linear-gradient(#1b1733,#141129)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
/* top bar */
#top{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:#0f0c22;border-bottom:1px solid var(--line)}
#lvbox{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
#lvbadge{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9bc4,#b33a78);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;border:2px solid #ffd1e4}
#lvinfo{flex:1;min-width:0}
#pname{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#expbar{height:6px;background:#2c2652;border-radius:3px;overflow:hidden;margin-top:3px}
#expfill{height:100%;background:linear-gradient(90deg,#8f7bff,#ff8fb8);width:0}
.cur{display:flex;align-items:center;gap:3px;background:#221d40;border-radius:12px;padding:3px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.cur.g{color:var(--gold)} .cur.d{color:var(--gem)} .cur.s{color:var(--stone)}
/* battle */
#stageWrap{position:relative;flex:none}
#cv{display:block;width:100%;aspect-ratio:480/290;background:#6fb3e8}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:6px 8px;pointer-events:none}
#stageName{background:rgba(10,8,25,.65);padding:4px 10px;border-radius:12px;font-size:13px;font-weight:800;text-shadow:0 1px 2px #000}
#stageName small{display:block;font-weight:500;font-size:10px;color:#d6cff5}
#rightHud{display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:auto}
.hbtn{background:rgba(10,8,25,.7);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:4px 8px;font-size:12px;font-weight:700}
.hbtn.on{background:#ff8fb8;color:#2a0c1c}
#bossBtn{background:linear-gradient(#ff6d6d,#c9233f);border-color:#ffb3b3;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#bossTimer{position:absolute;left:50%;top:40px;transform:translateX(-50%);width:62%;display:none}
#bossTimer .bar{height:8px;background:rgba(0,0,0,.5);border-radius:4px;overflow:hidden;border:1px solid rgba(255,255,255,.3)}
#bossTimer .fill{height:100%;background:linear-gradient(90deg,#ffd35a,#ff5d73)}
#bossTimer .lbl{text-align:center;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000;margin-bottom:2px}
/* skill bar */
#skillbar{display:flex;gap:6px;padding:6px 8px;background:#0f0c22;border-bottom:1px solid var(--line);align-items:center}
.sk{position:relative;width:46px;height:46px;border-radius:12px;background:#2c2652;border:2px solid #4b4288;display:grid;place-items:center;font-size:22px;overflow:hidden;flex:none}
.sk .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);height:0}
.sk .t{position:absolute;bottom:1px;right:3px;font-size:10px;font-weight:800;text-shadow:0 1px 2px #000}
.sk.lock{opacity:.35}
.sk.ready{border-color:#ffd35a;box-shadow:0 0 8px #ffd35a88}
#autoBtn{margin-left:auto;height:46px;padding:0 10px;border-radius:12px;background:#2c2652;border:2px solid #4b4288;font-weight:800;font-size:12px}
#autoBtn.on{background:#5be08a;color:#0d2a17;border-color:#aef5c6}
#spdBtn{height:46px;padding:0 10px;border-radius:12px;background:#2c2652;border:2px solid #4b4288;font-weight:800;font-size:12px}
/* panel */
#panel{flex:1;overflow-y:auto;padding:8px 8px 12px;-webkit-overflow-scrolling:touch}
#tabs{display:flex;background:#0f0c22;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;background:none;padding:6px 0 7px;font-size:10px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:1px}
#tabs button b{font-size:20px;font-weight:400;line-height:1.1}
#tabs button.on{color:#fff;background:linear-gradient(#2c2652,#0f0c22)}
#tabs button .dot{position:absolute}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.h{font-weight:800;font-size:14px;margin:2px 0 8px;display:flex;align-items:center;gap:6px}
.h .sub{margin-left:auto;font-size:11px;color:var(--mute);font-weight:500}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid #ffffff10}
.row:first-of-type{border-top:0}
.ic{width:40px;height:40px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-size:20px;flex:none;position:relative}
.grow{flex:1;min-width:0}
.t1{font-weight:700;font-size:13px}
.t2{font-size:11px;color:var(--mute);margin-top:2px}
.btn{background:linear-gradient(#ffa6c9,#e2619a);color:#2a0c1c;font-weight:800;font-size:12px;padding:7px 10px;border-radius:10px;min-width:74px;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.btn small{font-size:10px;font-weight:700;opacity:.85}
.btn.blue{background:linear-gradient(#8fe9ff,#3aa9d6);color:#06202b}
.btn.gold{background:linear-gradient(#ffe38a,#e7a92a);color:#2b1b00}
.btn.gray{background:#3a335f;color:#cfc8ef}
.btn:disabled{filter:grayscale(.8) brightness(.6);cursor:default}
.seg{display:flex;gap:4px;margin-left:auto}
.seg button{background:#2c2652;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;color:var(--mute)}
.seg button.on{background:#ff8fb8;color:#2a0c1c}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dashed #ffffff14;padding:3px 0}
.stats b{color:#fff}
.stats span{color:var(--mute)}
.gearslots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gs{background:var(--panel2);border-radius:12px;padding:6px 2px;text-align:center;border:2px solid #4b4288;font-size:11px;min-height:84px}
.gs .e{font-size:26px}
.gs .n{font-weight:700;font-size:10px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.invgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.it{background:var(--panel2);border-radius:10px;border:2px solid #555;aspect-ratio:1;display:grid;place-items:center;font-size:22px;position:relative}
.it .lv{position:absolute;right:3px;bottom:1px;font-size:10px;font-weight:800}
.it .eq{position:absolute;left:2px;top:0;font-size:10px}
.it.sel{outline:3px solid #fff}
.pill{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:8px;background:#ffffff1a}
.outfits{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.of{background:var(--panel2);border:2px solid #4b4288;border-radius:12px;padding:6px;text-align:center;font-size:11px}
.of.on{border-color:#ff8fb8}
.of canvas{width:100%;height:auto;display:block}
.promo{display:flex;gap:4px;margin:6px 0}
.promo div{flex:1;text-align:center;font-size:10px;padding:5px 2px;border-radius:8px;background:#2c2652;color:var(--mute)}
.promo div.done{background:#5b4bb3;color:#fff}
.promo div.next{outline:2px solid #ffd35a;color:#fff}
.note{font-size:11px;color:var(--mute);line-height:1.45}
/* modal & toast */
#modal{position:absolute;inset:0;background:rgba(5,3,15,.72);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.show{display:flex}
#mbox{background:var(--panel);border:1px solid #6a5fb0;border-radius:18px;padding:16px;width:100%;max-width:400px;max-height:85%;overflow:auto;text-align:center;box-shadow:0 10px 40px #000a}
#mbox h3{margin:0 0 8px;font-size:18px}
#mbox .rw{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
#mbox .rw .it{width:52px}
#toasts{position:absolute;left:0;right:0;top:34%;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:15}
.toast{background:rgba(15,10,35,.9);border:1px solid #6a5fb0;padding:6px 14px;border-radius:14px;font-size:13px;font-weight:700;animation:tin 2.2s forwards}
@keyframes tin{0%{opacity:0;transform:translateY(8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="lvbox">
      <div id="lvbadge">1</div>
      <div id="lvinfo"><div id="pname">Tân Binh · Lực chiến 0</div><div id="expbar"><div id="expfill"></div></div></div>
    </div>
    <div class="cur g">🪙<span id="cGold">0</span></div>
    <div class="cur d">💎<span id="cGem">0</span></div>
    <div class="cur s">🔮<span id="cStone">0</span></div>
  </div>
  <div id="stageWrap">
    <canvas id="cv" width="480" height="290"></canvas>
    <div id="hud">
      <div id="stageName">Ải 1-1<small>Đồng Cỏ Xanh</small></div>
      <div id="rightHud">
        <button class="hbtn" id="bossBtn" style="display:none">⚔️ Đánh Boss</button>
      </div>
    </div>
    <div id="bossTimer"><div class="lbl" id="btLbl">BOSS</div><div class="bar"><div class="fill" id="btFill"></div></div></div>
  </div>
  <div id="skillbar"></div>
  <div id="panel"></div>
  <nav id="tabs"></nav>
  <div id="toasts"></div>
  <div id="modal"><div id="mbox"></div></div>
</div>

<script>
'use strict';
/* =========================================================
   KIẾM & KHIÊN – NỮ KỴ SĨ IDLE
   Game nhàn rỗi: nữ kỵ sĩ tự chiến đấu qua các ải.
   ========================================================= */
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const SUF = ['', 'K', 'M', 'B', 'T'];
function fmt(n) {
  n = Math.floor(n);
  if (n < 1000) return String(n);
  let i = Math.floor(Math.log10(n) / 3);
  let s;
  if (i < SUF.length) s = SUF[i];
  else { const k = i - SUF.length; s = String.fromCharCode(97 + Math.floor(k / 26)) + String.fromCharCode(97 + k % 26); }
  const v = n / Math.pow(1000, i);
  return (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)) + s;
}
function todayKey() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }

/* ---------------- dữ liệu cố định ---------------- */
const REGIONS = [
  { n: 'Đồng Cỏ Xanh', sky: ['#7cc6f2', '#cdeefc'], hill: ['#5aa35c', '#7cc070'], ground: '#8fcf6a', dirt: '#6b9a47', enemies: ['slime', 'bat', 'goblin'] },
  { n: 'Rừng Hắc Ám', sky: ['#2e3d6b', '#6b7fb3'], hill: ['#1e3b34', '#2e5846'], ground: '#3f6b45', dirt: '#2b4a31', enemies: ['goblin', 'bat', 'mushroom'] },
  { n: 'Sa Mạc Cát Vàng', sky: ['#f2a65a', '#fde2a8'], hill: ['#d08a45', '#e6b26a'], ground: '#f0cc7a', dirt: '#c99b4e', enemies: ['skeleton', 'slime', 'scorpion'] },
  { n: 'Núi Lửa Đỏ', sky: ['#3b1020', '#a8384a'], hill: ['#3a1b1b', '#5a2323'], ground: '#5b3030', dirt: '#3a1c1c', enemies: ['imp', 'skeleton', 'bat'] },
  { n: 'Băng Nguyên', sky: ['#9fc6ef', '#eaf6ff'], hill: ['#b9d8f0', '#dcefff'], ground: '#eef7ff', dirt: '#b6d3ea', enemies: ['yeti', 'slime', 'bat'] },
  { n: 'Thành Quỷ', sky: ['#160c2a', '#4a2a78'], hill: ['#24163d', '#3a2562'], ground: '#40305e', dirt: '#2a1f40', enemies: ['imp', 'skeleton', 'knight'] },
];
const ENEMY = {
  slime: { n: 'Slime', c: '#5fd46b', spd: 38 }, bat: { n: 'Dơi', c: '#6b4a9a', spd: 60, fly: 1 },
  goblin: { n: 'Yêu Tinh', c: '#79b54a', spd: 45 }, mushroom: { n: 'Nấm Độc', c: '#d2455a', spd: 34 },
  skeleton: { n: 'Bộ Xương', c: '#e9e4d4', spd: 42 }, scorpion: { n: 'Bọ Cạp', c: '#b86a2b', spd: 48 },
  imp: { n: 'Tiểu Quỷ', c: '#e0503a', spd: 55, fly: 1 }, yeti: { n: 'Người Tuyết', c: '#f4fbff', spd: 32 },
  knight: { n: 'Hắc Kỵ Sĩ', c: '#3b3552', spd: 40 },
};
const UPG = [
  { k: 'atk', n: 'Tấn công', ic: '⚔️', base: 8, g: 1.1, desc: l => 'ATK ×' + (1.07 ** l).toFixed(2) + ' (+7%/cấp)' },
  { k: 'hp', n: 'Sinh lực', ic: '❤️', base: 8, g: 1.1, desc: l => 'HP ×' + (1.07 ** l).toFixed(2) + ' (+7%/cấp)' },
  { k: 'regen', n: 'Hồi máu', ic: '💚', base: 20, g: 1.16, max: 100, desc: l => (0.4 + l * 0.04).toFixed(2) + '% HP/giây' },
  { k: 'crit', n: 'Tỉ lệ chí mạng', ic: '🎯', base: 40, g: 1.2, max: 150, desc: l => (5 + l * 0.5).toFixed(1) + '%' },
  { k: 'critd', n: 'ST chí mạng', ic: '💥', base: 40, g: 1.14, desc: l => (150 + l * 6) + '%' },
  { k: 'aspd', n: 'Tốc đánh', ic: '⚡', base: 60, g: 1.22, max: 100, desc: l => '+' + (l * 2) + '% tốc đánh' },
];
const RARS = [
  { n: 'Thường', c: '#9aa3ad', m: 1 }, { n: 'Hiếm', c: '#4cc46a', m: 2.3 }, { n: 'Quý', c: '#3b8cf0', m: 5.5 },
  { n: 'Sử Thi', c: '#a55cf0', m: 13 }, { n: 'Huyền Thoại', c: '#f5a623', m: 32 }, { n: 'Thần Thoại', c: '#ff4d6d', m: 80 },
];
const RAR_ODDS = [55, 28, 12, 4, 0.9, 0.1];
const SLOTS = {
  weapon: { n: 'Kiếm', ic: '🗡️', base: 0.3, stat: 'ATK' },
  shield: { n: 'Khiên', ic: '🛡️', base: 0.25, stat: 'HP' },
  armor: { n: 'Giáp', ic: '🥋', base: 0.35, stat: 'HP' },
  ring: { n: 'Nhẫn', ic: '💍', base: 0.25, stat: 'ST Chí mạng' },
};
const SLOT_KEYS = Object.keys(SLOTS);
const GEAR_NAMES = {
  weapon: ['Kiếm Gỗ', 'Kiếm Thép', 'Kiếm Lam Quang', 'Kiếm Tử Tinh', 'Kiếm Bình Minh', 'Kiếm Thiên Hồng'],
  shield: ['Khiên Gỗ', 'Khiên Sắt', 'Khiên Bạch Kim', 'Khiên Tử Long', 'Khiên Mặt Trời', 'Khiên Thánh Nữ'],
  armor: ['Áo Vải', 'Giáp Da', 'Giáp Bạc', 'Giáp Tinh Linh', 'Giáp Phượng Hoàng', 'Giáp Thiên Thần'],
  ring: ['Nhẫn Đồng', 'Nhẫn Ngọc Lục', 'Nhẫn Lam Bảo', 'Nhẫn Tử Linh', 'Nhẫn Hoàng Kim', 'Nhẫn Vĩnh Hằng'],
};
const SKILLS = [
  { k: 'whirl', n: 'Chém Xoáy', ic: '🌀', cd: 6, unlock: 1, desc: l => 'Xoay kiếm gây ' + Math.round(skMul(l, 3) * 100) + '% ATK cho mọi quái gần' },
  { k: 'guard', n: 'Khiên Thánh', ic: '🛡️', cd: 12, unlock: 3, desc: l => 'Tạo khiên chắn ' + Math.round(20 + l * 4) + '% HP, đập choáng quái trước mặt 1.5s' },
  { k: 'beam', n: 'Kiếm Quang', ic: '✨', cd: 10, unlock: 6, desc: l => 'Phóng luồng kiếm khí xuyên thấu ' + Math.round(skMul(l, 5) * 100) + '% ATK' },
  { k: 'rain', n: 'Thiên Kiếm Vũ', ic: '⚔️', cd: 18, unlock: 12, desc: l => 'Triệu hồi 10 thanh kiếm rơi, mỗi thanh ' + Math.round(skMul(l, 1.6) * 100) + '% ATK' },
];
function skMul(l, b) { return b * (1 + 0.3 * (l - 1)); }
const RUNES = {
  fire: { n: 'Hỏa Ngọc', ic: '🔥', c: '#ff6a3d', desc: l => '25% đốt quái 3s, ' + Math.round(20 * l) + '% ATK/giây' },
  ice: { n: 'Băng Ngọc', ic: '❄️', c: '#7fd8ff', desc: l => (8 + 2 * l) + '% đóng băng quái 1.5s' },
  thunder: { n: 'Lôi Ngọc', ic: '⚡', c: '#ffe14d', desc: l => '18% sét lan 3 quái, ' + Math.round(60 + 40 * l) + '% ATK' },
  blood: { n: 'Huyết Ngọc', ic: '🩸', c: '#ff4d6d', desc: l => 'Hút máu ' + (1.5 * l).toFixed(1) + '% sát thương' },
  wind: { n: 'Phong Ngọc', ic: '🌪️', c: '#8ff5c4', desc: l => '+' + (6 * l) + '% tốc đánh' },
};
const RUNE_KEYS = Object.keys(RUNES);
const RUNE_MAX = 7;
const PROMO = [
  { n: 'Tân Binh', lv: 1, st: 1, gold: 0, stone: 0 },
  { n: 'Kỵ Sĩ', lv: 15, st: 8, gold: 2000, stone: 60 },
  { n: 'Hiệp Sĩ', lv: 35, st: 20, gold: 400000, stone: 400 },
  { n: 'Thánh Kỵ Sĩ', lv: 60, st: 35, gold: 6e7, stone: 1500 },
  { n: 'Nữ Chiến Thần', lv: 90, st: 55, gold: 1e11, stone: 5000 },
];
const OUTFITS = [
  { id: 'base', n: 'Kỵ Sĩ Hồng', price: 0, hair: '#f6c14b', hair2: '#d8952a', dress: '#e0457b', trim: '#fff0f6', eye: '#3a7bd5', bonus: 0 },
  { id: 'sakura', n: 'Anh Đào', price: 300, hair: '#ffb6d2', hair2: '#e57fa9', dress: '#fff2f7', trim: '#ff7fb0', eye: '#d6336c', bonus: 0.05 },
  { id: 'frost', n: 'Băng Tuyết', price: 500, hair: '#e9f6ff', hair2: '#a8cdea', dress: '#4a8fd8', trim: '#dff2ff', eye: '#5fd0ff', bonus: 0.08 },
  { id: 'shadow', n: 'Hắc Long', price: 800, hair: '#2b2533', hair2: '#120f18', dress: '#2d1a2f', trim: '#ff3d5e', eye: '#ff3d5e', bonus: 0.12 },
  { id: 'forest', n: 'Tinh Linh', price: 800, hair: '#8fe07a', hair2: '#4f9f45', dress: '#2f7a4f', trim: '#e9ffd6', eye: '#3cc98f', bonus: 0.12 },
  { id: 'royal', n: 'Hoàng Kim', price: 1500, hair: '#fff0b8', hair2: '#e5bd4f', dress: '#f7f1ff', trim: '#f2b92c', eye: '#9b59ff', bonus: 0.2 },
];

/* ---------------- lưu trữ ---------------- */
const SAVE_KEY = 'kiemkhien_save_v1';
function newState() {
  return {
    v: 1, name: 'Aria', gold: 0, gems: 300, stones: 20, lvl: 1, exp: 0,
    stage: 1, wave: 1, maxStage: 1, farm: false,
    up: { atk: 0, hp: 0, regen: 0, crit: 0, critd: 0, aspd: 0 },
    gear: { weapon: null, shield: null, armor: null, ring: null }, inv: [], nid: 1,
    skills: { whirl: 1, guard: 0, beam: 0, rain: 0 },
    runes: {}, rsl: [null, null, null],
    promo: 0, outfit: 'base', owned: ['base'],
    demonLv: 1, tix: { day: '', demon: 2, world: 3 }, bestWorld: 0,
    daily: '', auto: true, speed: 1, last: Date.now(), kills: 0, upMode: 1,
  };
}
let S;
try { S = Object.assign(newState(), JSON.parse(localStorage.getItem(SAVE_KEY) || 'null') || {}); } catch (e) { S = newState(); }
function save() { S.last = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { } }
function refreshTickets() {
  const k = todayKey();
  if (S.tix.day !== k) { S.tix = { day: k, demon: 2, world: 3 }; }
}
refreshTickets();

/* ---------------- vòng lặp ---------------- */
let lastT = performance.now(), hudT = 0, saveT = 0;
function loop(now) {
  let dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  const steps = S.speed;
  for (let i = 0; i < steps; i++) update(dt);
  render();
  hudT += dt; saveT += dt;
  if (hudT > 0.2) { hudT = 0; updateTop(); updateSkillbar(); updateBossTimer(); refreshAfford(); }
  if (saveT > 5) { saveT = 0; save(); }
  requestAnimationFrame(loop);
}

function renderSkillbar() {
  const sb = $('skillbar');
  sb.innerHTML = SKILLS.map(s => '<button class="sk" id="sk_' + s.k + '" data-k="' + s.k + '">' + s.ic + '<div class="cd"></div><div class="t"></div></button>').join('') +
    '<button id="spdBtn">x' + S.speed + '</button><button id="autoBtn" class="' + (S.auto ? 'on' : '') + '">TỰ ĐỘNG</button>';
  sb.querySelectorAll('.sk').forEach(b => b.onclick = () => { if (!castSkill(b.dataset.k)) { const s = SKILLS.find(x => x.k === b.dataset.k); if (S.maxStage < s.unlock) toast('Mở ở ải ' + s.unlock); } });
  $('autoBtn').onclick = () => { S.auto = !S.auto; renderSkillbar(); };
  $('spdBtn').onclick = () => { S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 3 : 1; renderSkillbar(); };
  updateSkillbar();
}
function updateSkillbar() {
  for (const s of SKILLS) {
    const b = $('sk_' + s.k); if (!b) continue;
    const locked = S.maxStage < s.unlock || !S.skills[s.k];
    b.classList.toggle('lock', locked);
    const cd = P.cds[s.k], full = s.cd * Math.max(0.5, 1 - 0.02 * ((S.skills[s.k] || 1) - 1));
    b.classList.toggle('ready', !locked && cd <= 0);
    b.querySelector('.cd').style.height = locked ? '0' : (cd / full * 100) + '%';
    b.querySelector('.t').textContent = locked ? '🔒' : cd > 0 ? cd.toFixed(0) : '';
  }
}

/* ---------------- toast & modal ---------------- */
function toast(s) {
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = s;
  $('toasts').appendChild(d); setTimeout(() => d.remove(), 2200);
  while ($('toasts').children.length > 3) $('toasts').firstChild.remove();
}
function showModal(html, btns) {
  $('mbox').innerHTML = html + '<div style="display:flex;gap:8px;justify-content:center;margin-top:12px">' +

  $('modal').classList.add('show');
  $('mbox').querySelectorAll('[data-i]').forEach(el => el.onclick = () => { $('modal').classList.remove('show'); const f = (btns || [])[+el.dataset.i]; if (f && f[2]) f[2](); updateTop(); });

function rewardTile(ic, n) { return '<div class="it" style="border-color:#6a5fb0">' + ic + '<span class="lv">' + fmt(n) + '</span></div>'; }
function runeTile(rk) { const [k, l] = rk.split('_'); return '<div class="it" style="border-color:' + RUNES[k].c + '">' + RUNES[k].ic + '<span class="lv">Lv' + l + '</span></div>'; }
function gearTile(it) { return '<div class="it" style="border-color:' + RARS[it.rar].c + ';background:' + RARS[it.rar].c + '22">' + SLOTS[it.slot].ic + '<span class="lv">+' + it.lv + '</span></div>'; }
function gearName(it) { return GEAR_NAMES[it.slot][it.rar] + (it.lv ? ' +' + it.lv : ''); }

/* ---------------- trang bị / ngọc ---------------- */
function rollRar(bonus) {
  let r = Math.random() * 100, acc = 0;
  for (let i = 0; i < RAR_ODDS.length; i++) { acc += RAR_ODDS[i]; if (r < acc) return Math.min(5, i + (bonus || 0)); }
  return 0;
}
function rollGear(bonus, slot) {
  const it = { id: S.nid++, slot: slot || pick(SLOT_KEYS), rar: rollRar(bonus), lv: 0 };
  S.inv.push(it); autoEquip(it); return it;
}
function autoEquip(it) {
  const cur = getItem(S.gear[it.slot]);
  if (!cur || gearVal(it) > gearVal(cur)) S.gear[it.slot] = it.id;
}
function addRune(rk) { S.runes[rk] = (S.runes[rk] || 0) + 1; }
function runeAvail(rk) { return (S.runes[rk] || 0) - S.rsl.filter(r => r === rk).length; }

function upBulk(k) {
  const d = UPG.find(x => x.k === k); let l = S.up[k], n = 0, cost = 0;
  const lim = S.upMode === 'max' ? 1e4 : S.upMode;
  while (n < lim && (!d.max || l < d.max)) {
    const c = upCost(k, l);
    if (S.upMode === 'max' && cost + c > S.gold) break;
    cost += c; l++; n++;
  }
  if (n === 0) { n = 1; cost = upCost(k, S.up[k]); }
  return { n, cost };
}

  p.querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b.dataset.act, b));
  p.querySelectorAll('[data-um]').forEach(b => b.onclick = () => { S.upMode = b.dataset.um === 'max' ? 'max' : +b.dataset.um; renderPanel(); });
  p.querySelectorAll('[data-sel]').forEach(b => b.onclick = () => { if (b.dataset.sel) { selItem = +b.dataset.sel; renderPanel(); } });
  p.querySelectorAll('canvas[data-of]').forEach(c => {
    const x = c.getContext('2d'), o = OUTFITS.find(z => z.id === c.dataset.of);
    x.clearRect(0, 0, 120, 130);
    drawHero(x, 58, 122, 1.05, o, S.promo, { t: 1, wr: (getItem(S.gear.weapon) || { rar: 0 }).rar, sr: (getItem(S.gear.shield) || { rar: 0 }).rar });
  });
  refreshAfford();
}
function spend(cur, n) { if (S[cur] < n) { toast('Không đủ ' + (cur === 'gold' ? 'vàng' : cur === 'gems' ? 'kim cương' : 'đá cường hóa')); return false; } S[cur] -= n; return true; }
function recalc() { const r = P.hp / st.hp; st = stats(); P.hp = Math.min(st.hp, st.hp * r); }
function act(a, el) {
  const [cmd, arg] = a.split(':');
  if (cmd === 'up') {
    const b = upBulk(arg);
    if (!spend('gold', b.cost)) return;
    S.up[arg] += b.n; recalc();
  } else if (cmd === 'equip') { const it = getItem(+arg); S.gear[it.slot] = it.id; recalc(); }
  else if (cmd === 'enh') {
    const it = getItem(+arg); if (!spend('stones', enhCost(it))) return;
    it.lv++; recalc(); toast('✨ Cường hóa thành công +' + it.lv);
  } else if (cmd === 'merge') {
    const it = getItem(+arg);
    const same = S.inv.filter(i => i.slot === it.slot && i.rar === it.rar && S.gear[i.slot] !== i.id && i.id !== it.id).slice(0, 2);
    if (same.length < 2) return;
    const wasEq = S.gear[it.slot] === it.id;
    const rm = new Set([it.id, ...same.map(i => i.id)]);
    S.stones += [it, ...same].reduce((a, i) => a + i.lv * 2, 0);
    S.inv = S.inv.filter(i => !rm.has(i.id));
    const ni = { id: S.nid++, slot: it.slot, rar: it.rar + 1, lv: 0 }; S.inv.push(ni);
    if (wasEq) S.gear[it.slot] = ni.id; else autoEquip(ni);
    selItem = ni.id; recalc();
    showModal('<h3>Hợp nhất thành công!</h3><div class="rw">' + gearTile(ni) + '</div><div style="color:' + RARS[ni.rar].c + ';font-weight:800">' + gearName(ni) + '</div>');
  } else if (cmd === 'sell') {
    const it = getItem(+arg); S.stones += 2 + it.rar * 4 + it.lv; S.inv = S.inv.filter(i => i.id !== it.id); selItem = null;
  } else if (cmd === 'autoeq') { for (const it of S.inv) autoEquip(it); recalc(); toast('Đã mặc đồ tốt nhất'); }
  else if (cmd === 'automerge') {
    let made = 0, again = true;
    while (again) {
      again = false;
      for (const k of SLOT_KEYS) for (let r = 0; r < 5; r++) {
        const pool = S.inv.filter(i => i.slot === k && i.rar === r && S.gear[k] !== i.id);
        while (pool.length >= 3) {
          const used = pool.splice(0, 3); const rm = new Set(used.map(i => i.id));
          S.stones += used.reduce((a, i) => a + i.lv * 2, 0);
          S.inv = S.inv.filter(i => !rm.has(i.id));
          const ni = { id: S.nid++, slot: k, rar: r + 1, lv: 0 }; S.inv.push(ni); autoEquip(ni); made++; again = true;
        }
      }
    }
    recalc(); toast(made ? 'Đã hợp nhất ' + made + ' lần' : 'Không có gì để hợp nhất');
  } else if (cmd === 'autosell') {
    const rm = S.inv.filter(i => i.rar === 0 && S.gear[i.slot] !== i.id);
    S.stones += rm.reduce((a, i) => a + 2 + i.lv, 0); S.inv = S.inv.filter(i => !rm.includes(i)); toast('Phân giải ' + rm.length + ' món');
  } else if (cmd === 'sk') {
    const lv = S.skills[arg];
    if (!lv) { S.skills[arg] = 1; P.cds[arg] = 0; toast('Đã học ' + SKILLS.find(s => s.k === arg).n); }
    else {
      const cost = +el.dataset.cost, sc = +el.dataset.need;
      if (S.stones < sc) { toast('Cần ' + sc + ' 🔮'); return; }
      if (!spend('gold', cost)) return; S.stones -= sc; S.skills[arg]++;
    }
    renderSkillbar();
  } else if (cmd === 'rune') {
    const ns = runeSlots(); const i = S.rsl.slice(0, ns).indexOf(null);
    if (i < 0) { toast('Hết ô trống – chạm ngọc đang khảm để tháo'); return; }
    S.rsl[i] = arg; recalc();
  } else if (cmd === 'unrune') { S.rsl[+arg] = null; recalc(); }
  else if (cmd === 'rmerge') {
    const [k, l] = arg.split('_'); if (runeAvail(arg) < 3) return;
    S.runes[arg] -= 3; addRune(k + '_' + (+l + 1)); toast('✨ ' + RUNES[k].n + ' Lv' + (+l + 1));
  } else if (cmd === 'sum') {
    const n = +arg, cost = n === 10 ? 270 : 30; if (!spend('gems', cost)) return;
    const got = []; for (let i = 0; i < n; i++) got.push(rollGear(0));
    recalc();
    showModal('<h3>🎁 Kết quả triệu hồi</h3><div class="rw">' + got.map(gearTile).join('') + '</div><div class="note">Đồ tốt hơn đã được tự động trang bị.</div>', [['Tiếp tục', 'btn']]);
  } else if (cmd === 'rsum') {
    const n = +arg, cost = n === 5 ? 280 : 60; if (!spend('gems', cost)) return;
    const got = []; for (let i = 0; i < n; i++) { const l = Math.random() < 0.08 ? 3 : Math.random() < 0.3 ? 2 : 1; const rk = pick(RUNE_KEYS) + '_' + l; addRune(rk); got.push(rk); }
    showModal('<h3>💠 Nhận ngọc</h3><div class="rw">' + got.map(runeTile).join('') + '</div>', [['Tiếp tục', 'btn']]);
  } else if (cmd === 'daily') {
    if (S.daily === todayKey()) return; S.daily = todayKey(); S.gems += 100; S.stones += 30;
    showModal('<h3>📅 Quà hằng ngày</h3><div class="rw">' + rewardTile('💎', 100) + rewardTile('🔮', 30) + '</div>');
  } else if (cmd === 'demon') { if (S.tix.demon <= 0 || mode !== 'stage') return; S.tix.demon--; startMode('demon'); }
  else if (cmd === 'world') { if (S.tix.world <= 0 || mode !== 'stage') return; S.tix.world--; startMode('world'); }
  else if (cmd === 'promo') {
    const nx = PROMO[S.promo + 1]; if (!nx) return;
    if (S.stones < nx.stone) { toast('Cần ' + nx.stone + ' 🔮'); return; }
    if (!spend('gold', nx.gold)) return; S.stones -= nx.stone; S.promo++; recalc(); P.hp = st.hp;
    fx.push({ type: 'ring', x: PX, y: GY - 40, life: 0.8, c: '#fff3b0' });
    showModal('<h3>👑 Thăng cấp thành ' + PROMO[S.promo].n + '!</h3><canvas id="promoCv" width="160" height="170" style="width:160px"></canvas><div class="note">Mọi chỉ số ×1.6 · Ngoại hình mới</div>');
    const pc = $('promoCv').getContext('2d'); drawHero(pc, 80, 160, 1.4, outfit(), S.promo, { t: 1, wr: (getItem(S.gear.weapon) || { rar: 0 }).rar, sr: (getItem(S.gear.shield) || { rar: 0 }).rar });
  } else if (cmd === 'buyof') { const o = OUTFITS.find(x => x.id === arg); if (!spend('gems', o.price)) return; S.owned.push(o.id); S.outfit = o.id; recalc(); toast('👗 ' + o.n); }
  else if (cmd === 'wear') { S.outfit = arg; }
  else if (cmd === 'rename') { const n = prompt('Tên nữ kỵ sĩ:', S.name); if (n && n.trim()) S.name = n.trim().slice(0, 14); }
  else if (cmd === 'reset') {
    showModal('<h3>Chơi lại từ đầu?</h3><div class="note">Toàn bộ tiến trình sẽ bị xóa.</div>', [['Hủy', 'btn gray'], ['Xóa & chơi lại', 'btn', () => { localStorage.removeItem(SAVE_KEY); S = newState(); save(); location.reload(); }]]);
    return;
  }
  save(); updateTop(); renderPanel();
}

/* ---------------- offline ---------------- */
function offlineReward() {
  const secs = Math.min(8 * 3600, (Date.now() - (S.last || Date.now())) / 1000);
  if (secs < 60) return;
  const s = Math.max(1, S.stage - 1);
  const kps = 0.35;
  const gold = goldDrop(s, 5) * kps * secs, exp = expDrop(s) * kps * secs, stn = Math.floor(kps * secs * 0.03);
  S.gold += gold; S.stones += stn; gainExp(exp);
  const hh = Math.floor(secs / 3600), mm = Math.floor(secs % 3600 / 60);
  showModal('<h3>🌙 Chào mừng trở lại!</h3><div class="note">Trong ' + (hh ? hh + ' giờ ' : '') + mm + ' phút vắng mặt, ' + S.name + ' đã tiếp tục săn quái.</div><div class="rw">' + rewardTile('🪙', gold) + rewardTile('⭐', exp) + rewardTile('🔮', stn) + '</div>', [['Nhận', 'btn']]);
}

/* ---------------- khởi động ---------------- */
const firstTime = !localStorage.getItem(SAVE_KEY);
st = stats(); P.hp = st.hp;
startMode('stage');
renderSkillbar(); renderPanel(); updateTop();
if (firstTime) {
  rollGear(0, 'weapon');
  recalc(); P.hp = st.hp; save(); renderPanel();
  showModal('<h3>⚔️ Kiếm & Khiên</h3><canvas id="introCv" width="160" height="170" style="width:160px"></canvas><div class="note">Nữ kỵ sĩ <b>' + S.name + '</b> lên đường đánh bại Ma Vương!<br>Cô ấy tự chiến đấu – bạn chỉ cần nâng cấp chỉ số, trang bị, kỹ năng và ngọc.<br>Nhận 300💎 khởi đầu, hãy thử 🎁 Triệu hồi!</div>', [['Bắt đầu', 'btn']]);
  drawHero($('introCv').getContext('2d'), 80, 160, 1.4, outfit(), 0, { t: 1 });
} else offlineReward();
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else { offlineReward(); lastT = performance.now(); } });
window.addEventListener('pagehide', save);
requestAnimationFrame(loop);
</script>
