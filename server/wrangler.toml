name = "cholaxanh-nap"
main = "worker.js"
compatibility_date = "2026-09-01"

# Tự động: GitHub Actions (.github/workflows/deploy-worker.yml) tìm kho KV tên ORDERS và điền id.
# Chạy tay: npx wrangler kv namespace create ORDERS  → dán id vào đây
[[kv_namespaces]]
binding = "ORDERS"
id = "DIEN_ID_KV_VAO_DAY"

[vars]
# Địa chỉ trang game, ví dụ "https://minhvy107.github.io" (để "*" khi đang thử)
ALLOWED_ORIGIN = "*"

# Khóa bí mật KHÔNG ghi ở đây. Chạy: npx wrangler secret put SEPAY_API_KEY

# 🎪 Chơi chung thời gian thực (Durable Objects)
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]
